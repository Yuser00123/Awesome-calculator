<!DOCTYPE html>
<html>
    <head>
        <title>Awesome Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="main-body">

            <div class=" tabs">
                <button id="calc-tab" class="tab active">Calculator</button>
                <button id="bmi-tab" class="tab">BMI</button>
            </div>

            <div id="calc-section">

            <div class="screen" id="display">0</div>
            <div class="keys">
            <div class="row">
                <button class="btn" data-value="1">1</button>
                <button class="btn" data-value="2">2</button>
                <button class="btn" data-value="3">3</button>
            </div>
            <div class="row">
                <button class="btn" data-value="4">4</button>
                <button class="btn" data-value="5">5</button>
                <button class="btn" data-value="6">6</button>
            </div>
            <div class="row">
                <button class="btn" data-value="7">7</button>
                <button class="btn" data-value="8">8</button>
                <button class="btn" data-value="9">9</button>
            </div>
            <div class="row">
                <button class="btn" data-value=".">.</button>
                <button class="btn" data-value="0">0</button>
                <button class="btn equal" data-value="equal">=</button>
            </div>
            <div class="row">
                <button class="btn operator" data-value="+">+</button>
                <button class="btn operator" data-value="-">-</button>
                <button class="btn operator" data-value="*">*</button>
            </div>
            <div class="row">
                <button class="btn operator" data-value="/">/</button>
                <button class="btn clear" data-value="clear">C</button>
                <button class="btn" data-value="00">00</button>
            </div>
            <div class="row">
                <button class="btn" data-value="delete">DEL</button>
                <button class="btn operator" data-value="percent">%</button>
            </div>
            </div>
            </div>
            <div id="bmi-section" class="bmi-section hidden">
                <div class="screen bmi-screen" id="bmi-result">BMI: --</div>
                <label for="height">Height (in cm)</label>
                <input type="number" id="height" placeholder="e.g. 170">

                <label for="weight">Weight (in kg)</label>
                <input type="number" id="weight" placeholder="e.g. 65">

                <button id="bmi-btn" class="bmi-btn">Calculate BMI</button>
                <button id="bmi-reset" class="bmi-reset">Reset</buttoon>
            </div>
        </div>

        <script src=script.js></script>
    </body>
</html>
